name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a changelog entry
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const baseFile = (path) => execFileSync('git', ['show', `${process.env.BASE_SHA}:${path}`], { encoding: 'utf8' });
          const baseVersion = JSON.parse(baseFile('package.json')).version;
          const headVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const section = (text, heading) => {
            const lines = text.split(/\r?\n/);
            const start = lines.findIndex((line) => line.trimEnd() === `## ${heading}`);
            if (start === -1) return null;
            const end = lines.findIndex((line, i) => i > start && line.startsWith('## '));
            return lines.slice(start + 1, end === -1 ? undefined : end).join('\n').trim();
          };
          const baseLog = baseFile('CHANGELOG.md');
          const headLog = readFileSync('CHANGELOG.md', 'utf8');
          if (headVersion === baseVersion) {
            const paths = execFileSync('git', ['diff', '--name-only', '-z', process.env.BASE_SHA, 'HEAD'], { encoding: 'utf8' }).split('\0').filter(Boolean);
            const needsEntry = paths.some((path) => /^(dist\/|openclaw\.plugin\.json$|src\/)/.test(path) && !path.endsWith('.test.ts'));
            if (!needsEntry) process.exit(0);
            const previous = new Set((section(baseLog, 'Unreleased') ?? '').split('\n').map((line) => line.trim()));
            const entries = (section(headLog, 'Unreleased') ?? '').split('\n').map((line) => line.trim());
            if (!entries.some((line) => /^-\s+\S/.test(line) && !previous.has(line))) {
              console.error('Add an entry under ## Unreleased in CHANGELOG.md.');
              process.exit(1);
            }
            process.exit(0);
          }

          const versionParts = (version) => {
            const match = /^(\d{2}|\d{4})\.(\d{1,2})\.(\d+)(?:-beta\.(\d+))?$/.exec(version);
            return match && [...match.slice(1, 4).map(BigInt), match[4] === undefined ? null : BigInt(match[4])];
          };
          const isBump = (base, head) => {
            if (!base || !head) return false;
            for (let i = 0; i < 3; i++) {
              if (head[i] !== base[i]) return head[i] > base[i];
            }
            return base[3] !== null && (head[3] === null || head[3] > base[3]);
          };
          if (!isBump(versionParts(baseVersion), versionParts(headVersion)) ||
              !section(headLog, headVersion) || section(baseLog, headVersion) !== null) {
            console.error('Bump package.json and add a new, non-empty matching version section to CHANGELOG.md.');
            process.exit(1);
          }
          console.log(`Documented release version bump: ${baseVersion} -> ${headVersion}`);
          NODE

      - name: Typecheck
        run: pnpm check

      - name: Validate version schema
        run: pnpm check:version

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
