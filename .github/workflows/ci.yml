name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a changeset or documented version bump
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "Changed files:"
          echo "${CHANGED_FILES}"

          if [ -z "${CHANGED_FILES}" ]; then
            echo "No changed files detected."
            exit 0
          fi

          NEEDS_CHANGESET=0
          HAS_CHANGESET=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              .changeset/*.md)
                if [[ "$file" != .changeset/README.md && -f "$file" ]]; then
                  HAS_CHANGESET=1
                fi
                ;;
              README.md|CONTRIBUTING.md|LICENSE|.gitignore|.github/*|.githooks/*|scripts/*|*.md)
                ;;
              *)
                NEEDS_CHANGESET=1
                ;;
            esac
          done <<EOF
          ${CHANGED_FILES}
          EOF

          if [ "$NEEDS_CHANGESET" -eq 0 ] || [ "$HAS_CHANGESET" -eq 1 ]; then
            echo "Changeset check passed."
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const baseFile = (path) => execFileSync('git', ['show', `${process.env.BASE_SHA}:${path}`], { encoding: 'utf8' });
          const baseVersion = JSON.parse(baseFile('package.json')).version;
          const headVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const versionParts = (version) => {
            const match = /^(\d{2}|\d{4})\.(\d{1,2})\.(\d+)(?:-beta\.(\d+))?$/.exec(version);
            return match && [...match.slice(1, 4).map(BigInt), match[4] === undefined ? null : BigInt(match[4])];
          };
          const isBump = (base, head) => {
            if (!base || !head) return false;
            for (let i = 0; i < 3; i++) {
              if (head[i] !== base[i]) return head[i] > base[i];
            }
            return base[3] !== null && (head[3] === null || head[3] > base[3]);
          };
          const heading = `## ${headVersion}`;
          const hasHeading = (text) => text.split(/\r?\n/).some((line) => line.trimEnd() === heading);

          if (!isBump(versionParts(baseVersion), versionParts(headVersion)) ||
              !hasHeading(readFileSync('CHANGELOG.md', 'utf8')) ||
              hasHeading(baseFile('CHANGELOG.md'))) {
            console.error('Add a changeset (pnpm changeset), or bump package.json and add a matching version heading to CHANGELOG.md.');
            process.exit(1);
          }
          console.log(`Documented release version bump: ${baseVersion} -> ${headVersion}`);
          NODE

      - name: Typecheck
        run: pnpm check

      - name: Validate version schema
        run: pnpm check:version

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
